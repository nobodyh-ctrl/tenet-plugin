name: release

# Publishes a GitHub release when a `claude plugin tag` tag is pushed (tenet--v<version>).
on:
  push:
    tags:
      - "tenet--v*"

# The only workflow with write access: it creates the release and uploads assets.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository
        run: python scripts/validate.py

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Build assets
        run: python scripts/build_release.py --out dist --tag "${GITHUB_REF_NAME}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(python scripts/build_release.py --print-version)"
          flags=()
          if [ "$(python scripts/build_release.py --print-prerelease)" = "true" ]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt \
            --title "tenet ${version}" \
            --notes-file docs/releases/v${version}.md \
            "${flags[@]}"
