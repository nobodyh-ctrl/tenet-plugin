name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: validate and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structural validation and secret scan
        run: python scripts/validate.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  claude-and-openspec:
    name: native validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: ShellCheck
        run: shellcheck installers/*.sh plugins/tenet/hooks/run-guard.sh
      - name: Install CLIs (no credentials needed for validation)
        run: npm install -g @anthropic-ai/claude-code @fission-ai/openspec@1.14.1
      - name: claude plugin validate
        run: |
          claude plugin validate . --strict
          claude plugin validate plugins/tenet --strict
      - name: openspec validate
        env:
          OPENSPEC_TELEMETRY: "0"
          OPENSPEC_NO_UPDATE_CHECK: "1"
        run: openspec validate --all --strict
